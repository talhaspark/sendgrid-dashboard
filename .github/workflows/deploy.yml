name: Deploy on push

on:
  push:
    branches: [ main, master ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up SSH agent
        uses: webfactory/ssh-agent@v0.8.1
        with:
          ssh-private-key: ${{ secrets.DEPLOY_KEY }}

      - name: Add SSH host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Sync files to server
        run: |
          rsync -az --delete --exclude='.git' --exclude='vendor' --exclude='node_modules' ./ "${{ secrets.DEPLOY_USER }}"@"${{ secrets.DEPLOY_HOST }}":"${{ secrets.TARGET_PATH }}"

      - name: Run post-deploy commands (optional)
        run: |
          if [ -n "${{ secrets.POST_DEPLOY_COMMANDS }}" ]; then
            ssh "${{ secrets.DEPLOY_USER }}"@"${{ secrets.DEPLOY_HOST }}" "${{ secrets.POST_DEPLOY_COMMANDS }}"
          else
            echo "No post-deploy commands configured."
          fi

