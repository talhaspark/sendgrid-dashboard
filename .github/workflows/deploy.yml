name: Deploy on push

on:
  push:
    branches: [ main, master ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${DEPLOY_HOST:-}" ]; then
            echo "ERROR: DEPLOY_HOST secret is missing or empty."
            exit 1
          fi
          if [ -z "${DEPLOY_KEY:-}" ]; then
            echo "ERROR: DEPLOY_KEY secret is missing or empty."
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s' "$DEPLOY_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Sync files to server
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          TARGET_PATH: ${{ secrets.TARGET_PATH }}
        run: |
          rsync -az --delete --exclude='.git' --exclude='vendor' --exclude='node_modules' ./ "$DEPLOY_USER"@"$DEPLOY_HOST":"$TARGET_PATH"

      - name: Run post-deploy commands (optional)
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          POST_DEPLOY_COMMANDS: ${{ secrets.POST_DEPLOY_COMMANDS }}
        run: |
          if [ -n "$POST_DEPLOY_COMMANDS" ]; then
            ssh -i ~/.ssh/id_rsa "$DEPLOY_USER"@"$DEPLOY_HOST" "$POST_DEPLOY_COMMANDS"
          else
            echo "No post-deploy commands configured."
          fi

